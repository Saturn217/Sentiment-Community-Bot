<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentiment Bot Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:       #0f1117;
    --surface:  #1a1d2e;
    --border:   #2a2d3e;
    --text:     #e2e8f0;
    --muted:    #8892a4;
    --green:    #22c55e;
    --red:      #ef4444;
    --yellow:   #eab308;
    --blue:     #3b82f6;
    --orange:   #f97316;
    --accent:   #6366f1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }
  a { color: var(--accent); }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  header h1 span { color: var(--accent); }
  #refresh-info { color: var(--muted); font-size: 12px; }

  .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

  /* ── Stat Cards ── */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 8px; }
  .card .value { font-size: 28px; font-weight: 700; line-height: 1; }
  .card .sub   { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .card.green  { border-color: rgba(34,197,94,.3); }
  .card.red    { border-color: rgba(239,68,68,.3); }
  .card.blue   { border-color: rgba(59,130,246,.3); }
  .card.orange { border-color: rgba(249,115,22,.3); }

  /* ── Sections ── */
  .section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
  .section h2 { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: var(--text); }
  .chart-wrap { position: relative; height: 220px; }

  /* ── Table ── */
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  .plat { font-size: 11px; color: var(--muted); }
  .bar-wrap { display: flex; align-items: center; gap: 8px; }
  .bar-bg { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width .3s; }

  /* ── Two-column feed ── */
  .feed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  @media (max-width: 700px) { .feed-grid { grid-template-columns: 1fr; } }
  .feed-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .feed-item:last-child { border-bottom: none; }
  .feed-item .meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .feed-item .msg  { font-size: 13px; line-height: 1.5; color: var(--text); }
  .feed-empty { color: var(--muted); font-size: 13px; padding: 12px 0; }

  /* ── Mood badge ── */
  .mood { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .mood-pos { background: rgba(34,197,94,.15); color: var(--green); }
  .mood-neg { background: rgba(239,68,68,.15); color: var(--red); }
  .mood-neu { background: rgba(234,179,8,.15);  color: var(--yellow); }

  #error-banner { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.4); color: var(--red); padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: none; }
  #loading { text-align: center; padding: 60px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>📊 Orderly Community Sentiment <span>Dashboard</span></h1>
  <span id="refresh-info">Refreshing every 60s</span>
</header>

<div class="container">
  <div id="error-banner"></div>
  <div id="loading">Loading data…</div>
  <div id="app" style="display:none">

    <!-- Stat cards -->
    <div class="stats-grid" id="stat-cards"></div>

    <!-- Trend chart -->
    <div class="section">
      <h2>📅 30-Day Sentiment Trend</h2>
      <div class="chart-wrap"><canvas id="trend-chart"></canvas></div>
    </div>

    <!-- Community breakdown -->
    <div class="section">
      <h2>🌐 Community Breakdown</h2>
      <table id="community-table">
        <thead><tr><th>Community</th><th>Platform</th><th>Messages</th><th>Sentiment</th><th>Positive %</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Issues + Feedback -->
    <div class="feed-grid">
      <div class="section">
        <h2>🐛 Recent Issues</h2>
        <div id="issues-feed"></div>
      </div>
      <div class="section">
        <h2>💡 Recent Feedback</h2>
        <div id="feedback-feed"></div>
      </div>
    </div>

    <!-- Top Users -->
    <div class="section">
      <h2>🏆 Top Contributors (7 days)</h2>
      <table id="users-table">
        <thead><tr><th>User</th><th>Community</th><th>Messages</th><th>Mood</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

  </div>
</div>

<script>
let trendChart = null;

function moodLabel(score) {
  if (score >  0.1)  return '<span class="mood mood-pos">😄 Positive</span>';
  if (score < -0.1)  return '<span class="mood mood-neg">😠 Negative</span>';
  return '<span class="mood mood-neu">😐 Neutral</span>';
}

function pct(a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; }

function fmtDate(d) {
  return new Date(d).toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

function renderStatCards(stats) {
  const avgScore = stats.avg_score ?? 0;
  const moodWord = avgScore > 0.3 ? "🔥 Very happy"
                 : avgScore > 0.1 ? "😄 Happy"
                 : avgScore > 0.02 ? "🙂 Positive"
                 : avgScore > -0.02 ? "😐 Mixed"
                 : avgScore > -0.1 ? "😕 Negative"
                 : "🚨 Unhappy";
  document.getElementById("stat-cards").innerHTML = `
    <div class="card blue">
      <div class="label">Total Messages</div>
      <div class="value">${(stats.total_messages||0).toLocaleString()}</div>
      <div class="sub">Last 30 days</div>
    </div>
    <div class="card ${avgScore > 0.02 ? "green" : avgScore < -0.02 ? "red" : ""}">
      <div class="label">Avg Sentiment</div>
      <div class="value">${avgScore.toFixed(3)}</div>
      <div class="sub">${moodWord}</div>
    </div>
    <div class="card red">
      <div class="label">Issues</div>
      <div class="value">${stats.issue_count||0}</div>
      <div class="sub">${pct(stats.issue_count, stats.total_messages)}% of messages</div>
    </div>
    <div class="card orange">
      <div class="label">Feedback</div>
      <div class="value">${stats.feedback_count||0}</div>
      <div class="sub">${pct(stats.feedback_count, stats.total_messages)}% of messages</div>
    </div>
    <div class="card green">
      <div class="label">Positive</div>
      <div class="value">${stats.positive_count||0}</div>
      <div class="sub">${pct(stats.positive_count, stats.total_messages)}%</div>
    </div>
    <div class="card red">
      <div class="label">Negative</div>
      <div class="value">${stats.negative_count||0}</div>
      <div class="sub">${pct(stats.negative_count, stats.total_messages)}%</div>
    </div>
  `;
}

function renderChart(trend) {
  const labels  = trend.map(r => fmtDate(r.date));
  const scores  = trend.map(r => parseFloat(r.avg_score?.toFixed(3) ?? 0));
  const counts  = trend.map(r => r.message_count);

  if (trendChart) trendChart.destroy();

  trendChart = new Chart(document.getElementById("trend-chart"), {
    type: "line",
    data: {
      labels,
      datasets: [
        {
          label: "Avg Sentiment",
          data: scores,
          borderColor: "#6366f1",
          backgroundColor: "rgba(99,102,241,0.1)",
          fill: true,
          tension: 0.4,
          pointRadius: 3,
          yAxisID: "y",
        },
        {
          label: "Messages",
          data: counts,
          borderColor: "#22c55e",
          backgroundColor: "rgba(34,197,94,0.1)",
          fill: false,
          tension: 0.4,
          pointRadius: 2,
          yAxisID: "y2",
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { color: "#8892a4", font: { size: 12 } } } },
      scales: {
        x:  { ticks: { color: "#8892a4", maxTicksLimit: 10, font: { size: 11 } }, grid: { color: "rgba(255,255,255,0.05)" } },
        y:  { ticks: { color: "#8892a4", font: { size: 11 } }, grid: { color: "rgba(255,255,255,0.05)" }, title: { display: true, text: "Sentiment", color: "#8892a4" } },
        y2: { position: "right", ticks: { color: "#22c55e", font: { size: 11 } }, grid: { drawOnChartArea: false }, title: { display: true, text: "Messages", color: "#22c55e" } },
      },
    },
  });
}

function renderCommunities(communities) {
  const tbody = document.querySelector("#community-table tbody");
  if (!communities.length) { tbody.innerHTML = '<tr><td colspan="5" style="color:var(--muted)">No community data yet.</td></tr>'; return; }
  tbody.innerHTML = communities.map(c => {
    const pos  = pct(c.positive_count, c.message_count);
    const neg  = pct(c.negative_count, c.message_count);
    const plat = c.platform === "telegram" ? "📱 Telegram" : "💬 Discord";
    const barColor = pos >= 60 ? "var(--green)" : neg >= 40 ? "var(--red)" : "var(--yellow)";
    return `<tr>
      <td><strong>${c.community}</strong></td>
      <td class="plat">${plat}</td>
      <td>${c.message_count}</td>
      <td>${moodLabel(c.avg_score)}</td>
      <td>
        <div class="bar-wrap">
          <div class="bar-bg"><div class="bar-fill" style="width:${pos}%;background:${barColor}"></div></div>
          <span style="font-size:12px;min-width:36px">${pos}%</span>
        </div>
      </td>
    </tr>`;
  }).join("");
}

function renderFeed(items, containerId, emptyMsg) {
  const el = document.getElementById(containerId);
  if (!items.length) { el.innerHTML = `<div class="feed-empty">${emptyMsg}</div>`; return; }
  el.innerHTML = items.map(i => {
    const when = new Date(i.timestamp).toLocaleString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    return `<div class="feed-item">
      <div class="meta">👤 <strong>${i.username}</strong> · ${i.community} · ${when}</div>
      <div class="msg">${(i.message_text||"").slice(0,200)}${(i.message_text||"").length>200?"…":""}</div>
    </div>`;
  }).join("");
}

function renderUsers(users) {
  const tbody = document.querySelector("#users-table tbody");
  if (!users.length) { tbody.innerHTML = '<tr><td colspan="4" style="color:var(--muted)">Not enough data yet (min. 3 messages).</td></tr>'; return; }
  tbody.innerHTML = users.map(u => {
    const plat = u.platform === "telegram" ? "📱" : "💬";
    return `<tr>
      <td>${plat} <strong>${u.username}</strong></td>
      <td class="plat">${u.community}</td>
      <td>${u.message_count}</td>
      <td>${moodLabel(u.avg_score)}</td>
    </tr>`;
  }).join("");
}

async function loadData() {
  try {
    const res  = await fetch("/api/dashboard");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    renderStatCards(data.totalStats || {});
    renderChart(data.dailyTrend || []);
    renderCommunities(data.communityBreakdown || []);
    renderFeed(data.recentIssues || [],   "issues-feed",   "✅ No issues in the last 7 days.");
    renderFeed(data.recentFeedback || [], "feedback-feed", "📭 No feedback in the last 7 days.");
    renderUsers(data.topUsers || []);

    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display     = "block";
    document.getElementById("error-banner").style.display = "none";

    const now = new Date().toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("refresh-info").textContent = `Last updated ${now} · refreshes every 60s`;
  } catch (err) {
    document.getElementById("error-banner").style.display = "block";
    document.getElementById("error-banner").textContent   = `⚠️ Failed to load data: ${err.message}`;
    console.error("Dashboard error:", err);
  }
}

loadData();
setInterval(loadData, 60_000);
</script>
</body>
</html>
